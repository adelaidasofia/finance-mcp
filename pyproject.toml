[project]
name = "finance-mcp"
version = "0.1.0"
description = "Local-first personal finance MCP. Aggregates bank, brokerage, credit, and loan accounts via Plaid. Writes balances, holdings, and transactions to your Obsidian vault (or any markdown folder). Tokens stored in macOS Keychain. Never sends data anywhere except plaid.com."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adelaida Diaz-Roa" }]
keywords = ["mcp", "plaid", "personal-finance", "net-worth", "obsidian", "claude"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastmcp>=3.4.2",
    "plaid-python>=40.0.0",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://diazroa.com"
Repository = "https://github.com/adelaidasofia/finance-mcp"
Issues = "https://github.com/adelaidasofia/finance-mcp/issues"

[project.scripts]
finance-mcp = "finance_mcp.server:run"

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finance_mcp*"]
